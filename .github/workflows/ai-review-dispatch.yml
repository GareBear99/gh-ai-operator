name: AI pre-review (dispatch)
# Triggered by the Portfolio when a new code-review issue is opened.
# Event payload shape (from the Portfolio workflow):
#   event_type: code-review-request
#   client_payload:
#     target_url:        https://github.com/owner/repo
#     portfolio_issue:   GareBear99/Portfolio#123
#     review_type:       "Full repo review"
#     depth:             "Standard"
#     focus:             "<free-text>"

on:
  repository_dispatch:
    types: [code-review-request]
  workflow_dispatch:
    inputs:
      target_url:
        description: "GitHub repo / PR / gist URL"
        required: true
      portfolio_issue:
        description: "owner/repo#NN to post back to (optional)"
        required: false
      review_type:
        description: "review type tag"
        required: false
        default: "standard"
      depth:
        description: "quick | standard | deep"
        required: false
        default: "standard"
      focus:
        description: "free-text focus"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github_ai_operator
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gather inputs
        id: vars
        env:
          CP_TARGET:   ${{ github.event.client_payload.target_url }}
          CP_ISSUE:    ${{ github.event.client_payload.portfolio_issue }}
          CP_TYPE:     ${{ github.event.client_payload.review_type }}
          CP_DEPTH:    ${{ github.event.client_payload.depth }}
          CP_FOCUS:    ${{ github.event.client_payload.focus }}
          IN_TARGET:   ${{ inputs.target_url }}
          IN_ISSUE:    ${{ inputs.portfolio_issue }}
          IN_TYPE:     ${{ inputs.review_type }}
          IN_DEPTH:    ${{ inputs.depth }}
          IN_FOCUS:    ${{ inputs.focus }}
        run: |
          {
            echo "target=${CP_TARGET:-$IN_TARGET}"
            echo "issue=${CP_ISSUE:-$IN_ISSUE}"
            echo "rtype=${CP_TYPE:-${IN_TYPE:-standard}}"
            echo "depth=${CP_DEPTH:-${IN_DEPTH:-standard}}"
            # Encode multi-line focus safely
            focus="${CP_FOCUS:-$IN_FOCUS}"
            printf 'focus<<FOCUS_EOF\n%s\nFOCUS_EOF\n' "$focus"
          } >> "$GITHUB_OUTPUT"

      - name: Install gh (for cross-repo issue comments)
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -qq gh
          }

      - name: Run single-target review
        env:
          # Prefer a user-scoped PAT (PORTFOLIO_WRITE_TOKEN) because the
          # workflow's built-in GITHUB_TOKEN cannot write issues in the
          # Portfolio repo. Falls back to GITHUB_TOKEN if the PAT isn't set,
          # in which case review_target.py will still produce the artifact
          # but the comment post-back will fail gracefully.
          GITHUB_TOKEN:          ${{ secrets.PORTFOLIO_WRITE_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_URL:            ${{ steps.vars.outputs.target }}
          PORTFOLIO_ISSUE:       ${{ steps.vars.outputs.issue }}
          REVIEW_TYPE:           ${{ steps.vars.outputs.rtype }}
          REVIEW_DEPTH:          ${{ steps.vars.outputs.depth }}
          FOCUS:                 ${{ steps.vars.outputs.focus }}
          # Cloudflare Workers AI (top-priority LLM backend when both are set).
          # Heuristic review still runs if these are absent.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python review_target.py

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-review
          path: github_ai_operator/output/target_review/*.md
          if-no-files-found: warn

      - name: Upload LLMBuilder training export
        uses: actions/upload-artifact@v4
        with:
          # ARC-Neuron-LLMBuilder's ingest script consumes this artifact.
          # Contains one JSONL line per live review in the seed-examples
          # schema LLMBuilder expects at data/<capability>/seed_examples.jsonl.
          name: llmbuilder-training-export
          path: github_ai_operator/output/training_export/**
          if-no-files-found: warn
          retention-days: 90
